{{- if eq .Values.secrets.mode "secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tt.secretName" . }}
  labels: {{- include "tt.labels" . | nindent 4 }}
  annotations: {{- include "tt.hookAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__Products: {{ required "secrets.values.ConnectionStrings__Products is required (or use secrets.mode=externalSecret|existing)" .Values.secrets.values.ConnectionStrings__Products | quote }}
  {{- with .Values.secrets.values.SecurityKey }}
  SecurityKey: {{ . | quote }}
  {{- end }}
{{- end }}
