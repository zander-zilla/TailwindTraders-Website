{{- if eq .Values.secrets.mode "externalSecret" }}
{{- $es := .Values.secrets.externalSecret }}
# External Secrets Operator: builds the app Secret from AWS Secrets Manager.
# The RDS-managed master secret holds only username/password; host/port come from values (Terraform outputs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tt.secretName" . }}
  labels: {{- include "tt.labels" . | nindent 4 }}
  annotations: {{- include "tt.hookAnnotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "tt.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Products: {{ printf "Host=%s;Port=%s;Database=%s;Username={{ .username }};Password={{ .password }};SSL Mode=Require" (required "secrets.externalSecret.dbHost is required" $es.dbHost) (toString $es.dbPort) $es.database | quote }}
        {{- if $es.jwtSecretKey }}
        SecurityKey: "{{ "{{" }} .jwt {{ "}}" }}"
        {{- end }}
  data:
    {{- range $p := list "username" "password" }}
    - secretKey: {{ $p }}
      remoteRef:
        key: {{ required "secrets.externalSecret.dbSecretKey is required" $es.dbSecretKey }}
        property: {{ $p }}
    {{- end }}
    {{- if $es.jwtSecretKey }}
    - secretKey: jwt
      remoteRef:
        key: {{ $es.jwtSecretKey }}
    {{- end }}
{{- end }}
