# Amazon EKS. Infrastructure comes from infra/terraform (Phase 5). Every <placeholder> maps to a Terraform output:
#   image.repository                         <- ecr_repository_url
#   config.Cart__TableName / Cart__Region    <- cart_table_name / region
#   secrets.externalSecret.dbSecretKey       <- aurora_master_secret_arn
#   secrets.externalSecret.dbHost / dbPort   <- aurora_endpoint / aurora_port
#   secrets.externalSecret.jwtSecretKey      <- jwt_secret_name
#   ingress.host + certificate-arn           <- domain_name variable / acm_certificate_arn (optional)
# CI (deploy-aws.yaml) passes these as --set from GitHub repo variables; manually:
#   terraform -chdir=infra/terraform output -raw helm_values > deploy/helm/tailwindtraders/values-eks.generated.yaml
#   helm upgrade --install ... -f values-eks.yaml -f values-eks.generated.yaml --set image.tag=<sha>
image:
  repository: <account>.dkr.ecr.<region>.amazonaws.com/tailwindtraders/web
  tag: <git-sha>              # immutable tags; set by CI (Phase 5)
  pullPolicy: IfNotPresent    # node role pulls from ECR
replicaCount: 2
serviceAccount:
  create: true
  name: tailwindtraders-web
  # EKS Pod Identity: create the association (namespace + this SA -> IAM role with DynamoDB access on the
  # tt-cart table); no annotation needed. If you use IRSA instead, set:
  annotations: {}
  #  eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/tailwindtraders-web
config:
  Cart__TableName: tt-cart
  Cart__Region: <region>
  Cart__ServiceUrl: ""        # real DynamoDB endpoint
  Cart__CreateTable: "false"  # the table is owned by IaC (on-demand, TTL on expiresAt)
secrets:
  mode: externalSecret        # External Secrets Operator <- AWS Secrets Manager
  externalSecret:
    secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
    dbSecretKey: <aurora_master_secret_arn>   # RDS-managed secret: {"username","password"}
    dbHost: <aurora_endpoint>
    dbPort: "5432"
    database: tailwind
    jwtSecretKey: <jwt_secret_name>
service:
  type: ClusterIP
ingress:
  enabled: true
  className: alb              # AWS Load Balancer Controller
  host: ""                    # optional domain_name; empty = any host (use the ALB DNS name)
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # With a domain + ACM certificate, CI adds (or add in values-eks.generated.yaml):
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"
    #   alb.ingress.kubernetes.io/certificate-arn: <acm_certificate_arn>
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/group.name: tailwindtraders
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
