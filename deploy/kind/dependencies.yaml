# Local-only backing services for kind: PostgreSQL 17 (catalog), DynamoDB Local (cart), .NET Aspire dashboard (OTLP + UI).
# Ephemeral (emptyDir / in-memory). In AWS these are Aurora PostgreSQL and Amazon DynamoDB.
apiVersion: v1
kind: Secret
metadata: { name: postgres-local, labels: { app.kubernetes.io/part-of: tailwindtraders-deps } }
type: Opaque
stringData: { POSTGRES_DB: tailwind, POSTGRES_USER: tailwind, POSTGRES_PASSWORD: tailwind-local }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres, app.kubernetes.io/part-of: tailwindtraders-deps } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom: [{ secretRef: { name: postgres-local } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "tailwind", "-d", "tailwind"] }
            periodSeconds: 3
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app.kubernetes.io/part-of: tailwindtraders-deps } }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dynamodb, labels: { app: dynamodb, app.kubernetes.io/part-of: tailwindtraders-deps } }
spec:
  replicas: 1
  selector: { matchLabels: { app: dynamodb } }
  template:
    metadata: { labels: { app: dynamodb } }
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:latest
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { tcpSocket: { port: 8000 }, periodSeconds: 3 }
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: dynamodb, labels: { app.kubernetes.io/part-of: tailwindtraders-deps } }
spec: { selector: { app: dynamodb }, ports: [{ port: 8000, targetPort: 8000 }] }
---
# .NET Aspire dashboard: receives OTLP from the app (gRPC :18889 in-cluster) and the browser (HTTP :18890 via NodePort 30318 -> localhost:4318).
# Local demo only: anonymous access.
apiVersion: apps/v1
kind: Deployment
metadata: { name: aspire-dashboard, labels: { app: aspire-dashboard, app.kubernetes.io/part-of: tailwindtraders-deps } }
spec:
  replicas: 1
  selector: { matchLabels: { app: aspire-dashboard } }
  template:
    metadata: { labels: { app: aspire-dashboard } }
    spec:
      containers:
        - name: dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
          env:
            - { name: ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS, value: "true" }
            - { name: DASHBOARD__OTLP__CORS__ALLOWEDORIGINS, value: "http://localhost:2000" }
            - { name: DASHBOARD__OTLP__CORS__ALLOWEDHEADERS, value: "*" }
          ports:
            - { name: ui, containerPort: 18888 }
            - { name: otlp-grpc, containerPort: 18889 }
            - { name: otlp-http, containerPort: 18890 }
          readinessProbe: { tcpSocket: { port: 18888 }, periodSeconds: 3 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: aspire-dashboard, labels: { app.kubernetes.io/part-of: tailwindtraders-deps } }
spec:
  type: NodePort
  selector: { app: aspire-dashboard }
  ports:
    - { name: ui, port: 18888, targetPort: 18888, nodePort: 30888 }
    - { name: otlp-grpc, port: 18889, targetPort: 18889 }
    - { name: otlp-http, port: 18890, targetPort: 18890, nodePort: 30318 }
