# kind cluster for the Tailwind Traders demo. Works on Apple Silicon (arm64 node image) and x86.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tailwindtraders
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # Service NodePort (values-kind.yaml)
        hostPort: 2000         # http://localhost:2000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30888   # Aspire dashboard UI
        hostPort: 18888        # http://localhost:18888
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30318   # Aspire dashboard OTLP/HTTP (browser spans)
        hostPort: 4318
        listenAddress: "127.0.0.1"
        protocol: TCP
