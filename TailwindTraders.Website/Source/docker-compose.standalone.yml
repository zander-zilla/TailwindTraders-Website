# Local full stack (Phase 2): hardened web image + SQL Server + MongoDB.
#   docker compose -f docker-compose.standalone.yml up --build
#   open http://localhost:2000   (liveness: http://localhost:2000/healthz)
# Demo credentials only — never reuse these outside local development.
name: tailwindtraders

services:
  web:
    build:
      context: Tailwind.Traders.Web
      dockerfile: Dockerfile
    image: tailwindtraders/web:local
    depends_on:
      sql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: on-failure
    environment:
      SqlConnectionString: "Server=sql,1433;Database=master;User Id=sa;Password=${SQL_SA_PASSWORD:-Passw0rd!123};TrustServerCertificate=true"
      MongoConnectionString: "mongodb://mongo:27017"
      ApiUrl: "/api/v1"
      ApiUrlShoppingCart: "/api/v1"
      # Phase 3a: ConnectionStrings__Products: "Host=postgres;Database=tailwind;Username=tailwind;Password=..."
      # Phase 3b: Cart__TableName: "tt-cart"  AWS__ServiceURL: "http://dynamodb:8000"  AWS_REGION: "us-east-1"
    ports: ["2000:8080"]
    read_only: true            # app writes nothing to disk
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No healthcheck here: the chiseled image has no shell/curl. Probe GET /healthz from outside
    # (Kubernetes liveness probe in Phase 4).

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Passw0rd!123}"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6

