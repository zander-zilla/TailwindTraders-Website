name: Build check on PR

on:
  pull_request:
    paths:
      - 'TailwindTraders.Website/**'
      - '.github/workflows/pr_build_check.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Baseline tests (Testcontainers SQL Server + MongoDB)
      working-directory: TailwindTraders.Website/Source
      run: dotnet test Tailwind.Traders.Web.Tests -p:BuildingDocker=true --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TailwindTraders.Website/Source/Tailwind.Traders.Web/ClientApp
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: TailwindTraders.Website/Source/Tailwind.Traders.Web/ClientApp/package-lock.json
    - name: npm ci (no --legacy-peer-deps since Phase 7)
      run: npm ci --no-audit --no-fund
    - name: Vitest
      run: npm test
    - name: Vite build
      run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Docker build (.NET 10 + Node 22)
      working-directory: TailwindTraders.Website/Source/Tailwind.Traders.Web
      run: docker build . -t tailwindtraders/web:gh-${{ github.sha }}

  compose:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Full stack via docker compose (postgres + dynamodb-local + aspire-dashboard + migrate job + web)
      working-directory: TailwindTraders.Website/Source
      run: |
        docker compose -f docker-compose.standalone.yml up -d --build --quiet-pull
        for i in $(seq 1 60); do curl -fsS http://localhost:2000/healthz && break; sleep 3; done
        docker compose -f docker-compose.standalone.yml ps -a
        test "$(docker compose -f docker-compose.standalone.yml ps -a migrate --format '{{.ExitCode}}')" = "0"
        curl -fsS "http://localhost:2000/api/v1/products?type=home" | grep -q '"products":\[{'
        curl -fsS http://localhost:2000/api/v1/products/1 | grep -q 'Microwave'
        curl -fsS http://localhost:2000/ | grep -qi '<!doctype html>'
        # cart round trip against DynamoDB Local
        TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"ci@contoso.com","password":"x","grant_type":"password"}' http://localhost:2000/api/v1/login | jq -r .access_token.token)
        curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"detailProduct":{"id":1},"qty":2}' http://localhost:2000/api/v1/shoppingcart
        curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:2000/api/v1/shoppingcart | jq -e '.[0].qty == 2 and .[0].price == 100'
        # OpenTelemetry: app -> Aspire dashboard (cart.add + PostgreSQL + DynamoDB spans)
        sleep 10
        curl -fsS "http://localhost:18888/api/telemetry/traces?limit=200" | jq -e '[.data.resourceSpans[].scopeSpans[].scope.name] | (index("TailwindTraders.Web") != null) and (index("Npgsql") != null) and (index("AWSSDK.DynamoDB") != null)'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Playwright browser smoke (browse, login, add to cart)
      working-directory: TailwindTraders.Website/Source/Tailwind.Traders.Web/ClientApp
      run: |
        npm ci --no-audit --no-fund
        npx playwright install --with-deps chromium
        BASE_URL=http://localhost:2000 npx playwright test
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: TailwindTraders.Website/Source/Tailwind.Traders.Web/ClientApp/playwright-report
    - name: Logs on failure
      if: failure()
      working-directory: TailwindTraders.Website/Source
      run: docker compose -f docker-compose.standalone.yml logs
