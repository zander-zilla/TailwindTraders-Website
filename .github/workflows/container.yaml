name: Container build & scan

on:
  pull_request:
    paths:
      - 'TailwindTraders.Website/Source/Tailwind.Traders.Web/**'
      - '.github/workflows/container.yaml'
  push:
    branches: [ main ]
    paths:
      - 'TailwindTraders.Website/Source/Tailwind.Traders.Web/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: tailwindtraders/web:ci-${{ github.sha }}

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build image (hardened, chiseled)
      uses: docker/build-push-action@v6
      with:
        context: TailwindTraders.Website/Source/Tailwind.Traders.Web
        load: true
        tags: ${{ env.IMAGE }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image size
      run: |
        echo "Image size: $(docker image inspect ${{ env.IMAGE }} --format '{{.Size}}' | numfmt --to=si)" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Smoke test (/healthz, runs read-only as non-root)
      run: |
        docker run -d --name web --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 ${{ env.IMAGE }}
        for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done
        test "$(curl -fsS http://localhost:8080/healthz)" = "Healthy"
        test "$(docker inspect web --format '{{.Config.User}}')" != ""
        docker rm -f web

    - name: Trivy scan (report all severities)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        format: table
        scanners: vuln
        ignore-unfixed: false
        exit-code: '0'

    - name: Trivy gate (fail on CRITICAL)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        format: table
        scanners: vuln
        severity: CRITICAL
        exit-code: '1'
        skip-setup-trivy: true

    - name: SBOM (CycloneDX)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        format: cyclonedx
        output: sbom.cdx.json
        skip-setup-trivy: true

    - uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.cdx.json
